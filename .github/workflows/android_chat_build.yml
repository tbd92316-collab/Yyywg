name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Chat App
        run: |
          # 0. Clean workspace completely
          rm -rf global_chat_android
          mkdir -p global_chat_android
          cd global_chat_android

          # 1. Initialize Flutter project cleanly
          flutter create . --org com.globalchat --project-name global_chat_android

          # 2. Patch App-level build.gradle & AndroidManifest safely
          echo "Patching Android configurations..."
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
            sed -i -E 's/compileSdk [0-9]+/compileSdk 34/g' android/app/build.gradle
            sed -i -E 's/targetSdk [0-9]+/targetSdk 34/g' android/app/build.gradle
            sed -i -E 's/minSdkVersion [0-9]+/minSdkVersion 21/g' android/app/build.gradle
            sed -i -E 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          fi

          # Fix for compileSdkVersion in android/build.gradle if present
          if [ -f android/build.gradle ]; then
            sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' android/build.gradle || true
          fi
          
          # Allow HTTP ClearText traffic and required permissions
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

          # 3. Add Dependencies to pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: global_chat_android
          description: "Global Wi-Fi Offline Chat Android App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            path_provider: ^2.1.2
            network_info_plus: ^5.0.1
            qr_flutter: ^4.1.0
            mobile_scanner: ^5.1.1
            file_picker: ^8.0.0
            archive: ^4.0.2
            shared_preferences: ^2.2.2
            url_launcher: ^6.2.5
            video_player: ^2.8.2
            audioplayers: ^6.0.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # 4. Create Main Flutter Code for Android
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:network_info_plus/network_info_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:qr_flutter/qr_flutter.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:archive/archive_io.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:video_player/video_player.dart';
          import 'package:audioplayers/audioplayers.dart';

          void main() {
            runApp(const GlobalChatApp());
          }

          class GlobalChatApp extends StatefulWidget {
            const GlobalChatApp({super.key});

            @override
            State<GlobalChatApp> createState() => _GlobalChatAppState();
          }

          class _GlobalChatAppState extends State<GlobalChatApp> {
            bool isDarkMode = true;

            void toggleTheme() {
              setState(() {
                isDarkMode = !isDarkMode;
              });
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Global Wi-Fi Chat',
                theme: isDarkMode ? ThemeData.dark(useMaterial3: true) : ThemeData.light(useMaterial3: true),
                home: HomeScreen(toggleTheme: toggleTheme, isDarkMode: isDarkMode),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            final VoidCallback toggleTheme;
            final bool isDarkMode;

            const HomeScreen({super.key, required this.toggleTheme, required this.isDarkMode});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final TextEditingController _ipController = TextEditingController();
            String myIp = "Detecting IP...";
            String savedUsername = "";

            @override
            void initState() {
              super.initState();
              _fetchLocalIp();
              _loadSavedUsername();
            }

            Future<void> _fetchLocalIp() async {
              try {
                final info = NetworkInfo();
                String? ip = await info.getWifiIP();
                if (ip == null || ip.isEmpty) {
                  for (var interface in await NetworkInterface.list()) {
                    for (var addr in interface.addresses) {
                      if (addr.type == InternetAddressType.IPv4 && !addr.isLoopback) {
                        ip = addr.address;
                        break;
                      }
                    }
                  }
                }
                setState(() {
                  myIp = ip ?? "127.0.0.1";
                });
              } catch (e) {
                setState(() {
                  myIp = "127.0.0.1";
                });
              }
            }

            Future<void> _loadSavedUsername() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                savedUsername = prefs.getString('saved_username') ?? "";
              });
            }

            void _scanQR() async {
              String? scannedIp = await Navigator.push(
                context,
                MaterialPageRoute(builder: (context) => const QRScannerScreen()),
              );
              if (scannedIp != null && scannedIp.isNotEmpty) {
                setState(() {
                  _ipController.text = scannedIp;
                });
                _askUsernameAndProceed(false);
              }
            }

            void _askUsernameAndProceed(bool isHost) {
              TextEditingController nameController = TextEditingController(text: savedUsername);
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  title: Text(isHost ? "Start Server as Host" : "Join Chat Board"),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(
                        controller: nameController,
                        decoration: const InputDecoration(
                          labelText: "Enter Your Display Name",
                          border: OutlineInputBorder(),
                        ),
                      ),
                      if (!isHost) ...[
                        const SizedBox(height: 15),
                        TextField(
                          controller: _ipController,
                          decoration: const InputDecoration(
                            labelText: "Enter Host IP Address",
                            border: OutlineInputBorder(),
                          ),
                        ),
                      ]
                    ],
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(context),
                      child: const Text("Cancel"),
                    ),
                    ElevatedButton(
                      onPressed: () async {
                        String name = nameController.text.trim();
                        if (name.isEmpty) return;
                        if (!isHost && _ipController.text.trim().isEmpty) return;

                        final prefs = await SharedPreferences.getInstance();
                        await prefs.setString('saved_username', name);

                        if (context.mounted) {
                          Navigator.pop(context);
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (context) => ChatScreen(
                                isHost: isHost,
                                username: name,
                                serverIp: isHost ? myIp : _ipController.text.trim(),
                                toggleTheme: widget.toggleTheme,
                                isDarkMode: widget.isDarkMode,
                              ),
                            ),
                          );
                        }
                      },
                      child: Text(isHost ? "Start" : "Join"),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text("Global Offline Chat"),
                  centerTitle: true,
                  actions: [
                    IconButton(
                      icon: Icon(widget.isDarkMode ? Icons.wb_sunny : Icons.nightlight_round),
                      onPressed: widget.toggleTheme,
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.wifi_tethering, size: 90, color: Colors.blueAccent),
                        const SizedBox(height: 15),
                        Text(
                          "Your IP: $myIp",
                          style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.green),
                        ),
                        const SizedBox(height: 35),
                        SizedBox(
                          width: double.infinity,
                          height: 50,
                          child: ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                            icon: const Icon(Icons.dns, color: Colors.white),
                            label: const Text("Start Server (Host)", style: TextStyle(fontSize: 16, color: Colors.white)),
                            onPressed: () => _askUsernameAndProceed(true),
                          ),
                        ),
                        const SizedBox(height: 15),
                        SizedBox(
                          width: double.infinity,
                          height: 50,
                          child: ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent),
                            icon: const Icon(Icons.group_add, color: Colors.white),
                            label: const Text("Join Chat Board", style: TextStyle(fontSize: 16, color: Colors.white)),
                            onPressed: () => _askUsernameAndProceed(false),
                          ),
                        ),
                        const SizedBox(height: 15),
                        SizedBox(
                          width: double.infinity,
                          height: 50,
                          child: OutlinedButton.icon(
                            icon: const Icon(Icons.qr_code_scanner),
                            label: const Text("Scan QR Code", style: TextStyle(fontSize: 16)),
                            onPressed: _scanQR,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class QRScannerScreen extends StatelessWidget {
            const QRScannerScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Scan Host QR Code")),
                body: MobileScanner(
                  onDetect: (capture) {
                    final List<Barcode> barcodes = capture.barcodes;
                    for (final barcode in barcodes) {
                      if (barcode.rawValue != null) {
                        Navigator.pop(context, barcode.rawValue);
                        break;
                      }
                    }
                  },
                ),
              );
            }
          }

          class ChatScreen extends StatefulWidget {
            final bool isHost;
            final String username;
            final String serverIp;
            final VoidCallback toggleTheme;
            final bool isDarkMode;

            const ChatScreen({
              super.key,
              required this.isHost,
              required this.username,
              required this.serverIp,
              required this.toggleTheme,
              required this.isDarkMode,
            });

            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            HttpServer? _rawServer;
            List<Map<String, dynamic>> messages = [];
            final TextEditingController _msgController = TextEditingController();
            List<WebSocket> connectedClients = [];
            WebSocket? _clientWs;
            File? _tempHistoryFile;
            
            bool _isExiting = false;
            bool _isUploading = false;

            @override
            void initState() {
              super.initState();
              if (widget.isHost) {
                _startLocalServer();
              } else {
                _connectToServer();
              }
            }

            Future<void> _startLocalServer() async {
              try {
                final dir = await getTemporaryDirectory();
                _tempHistoryFile = File('${dir.path}/temp_chat.json');
                await _tempHistoryFile!.writeAsString(jsonEncode([]));

                _rawServer = await HttpServer.bind(InternetAddress.anyIPv4, 8080);
                
                _rawServer!.listen((HttpRequest request) async {
                  try {
                    if (WebSocketTransformer.isUpgradeRequest(request)) {
                      WebSocket socket = await WebSocketTransformer.upgrade(request);
                      _handleHostWebSocket(socket);
                    } 
                    else if (request.uri.path == '/upload') {
                      String? fileId = request.uri.queryParameters['id'];
                      if (fileId != null) {
                        File f = File('${dir.path}/$fileId');
                        var sink = f.openWrite();
                        await sink.addStream(request);
                        await sink.close();
                        request.response.statusCode = 200;
                        request.response.close();
                      }
                    } 
                    else if (request.uri.pathSegments.isNotEmpty && request.uri.pathSegments.first == 'files') {
                      String fileId = request.uri.pathSegments[1];
                      File f = File('${dir.path}/$fileId');
                      
                      if (f.existsSync()) {
                        String mimeType = 'application/octet-stream';
                        if (request.uri.pathSegments.length > 2) {
                          String fName = Uri.decodeComponent(request.uri.pathSegments[2]);
                          String ext = fName.contains('.') ? fName.split('.').last.toLowerCase() : '';
                          if (['png', 'jpg', 'jpeg', 'gif', 'webp'].contains(ext)) {
                            mimeType = ext == 'jpg' ? 'image/jpeg' : 'image/$ext';
                          } else if (ext == 'mp4' || ext == 'mkv' || ext == 'avi' || ext == 'mov') {
                            mimeType = 'video/mp4';
                          } else if (ext == 'mp3' || ext == 'wav' || ext == 'm4a' || ext == 'aac') {
                            mimeType = 'audio/mpeg';
                          } else if (ext == 'pdf') {
                            mimeType = 'application/pdf';
                          }
                        }
                        request.response.headers.set(HttpHeaders.contentTypeHeader, mimeType);
                        
                        await request.response.addStream(f.openRead());
                        request.response.close();
                      } else {
                        request.response.statusCode = 404;
                        request.response.close();
                      }
                    }
                  } catch (e) {
                    debugPrint("Server handling error: $e");
                  }
                });

                setState(() {
                  messages.add({
                    "sender": "System",
                    "text": "Server started by ${widget.username} at IP: ${widget.serverIp}:8080",
                    "time": _currentTime()
                  });
                });
              } catch (e) {
                _showErrorAndExit("Failed to start server: $e");
              }
            }

            void _handleHostWebSocket(WebSocket socket) {
              connectedClients.add(socket);
              socket.add(jsonEncode({"type": "history", "data": messages}));

              socket.listen((data) {
                try {
                  var decoded = jsonDecode(data.toString());
                  if (decoded['type'] == 'join') {
                    String clientName = decoded['sender'];
                    var sysMsg = {
                      "sender": "System",
                      "text": "$clientName joined the chat",
                      "time": _currentTime()
                    };
                    _broadcastMessage(sysMsg);
                    _saveAndAddMessage(sysMsg);
                  } else {
                    _broadcastMessage(decoded);
                    _saveAndAddMessage(decoded);
                  }
                } catch (e) {
                  debugPrint("Error handling message: $e");
                }
              }, onDone: () {
                connectedClients.remove(socket);
              }, onError: (error) {
                connectedClients.remove(socket);
              });
            }

            void _broadcastMessage(Map<String, dynamic> msg) {
              String encoded = jsonEncode(msg);
              for (var client in connectedClients) {
                client.add(encoded);
              }
            }

            Future<void> _saveAndAddMessage(Map<String, dynamic> msg) async {
              setState(() {
                messages.add(msg);
              });
              if (_tempHistoryFile != null) {
                await _tempHistoryFile!.writeAsString(jsonEncode(messages));
              }
            }

            Future<void> _connectToServer() async {
              try {
                _clientWs = await WebSocket.connect('ws://${widget.serverIp}:8080');

                _clientWs!.add(jsonEncode({
                  "type": "join",
                  "sender": widget.username,
                  "time": _currentTime()
                }));

                _clientWs!.listen((data) {
                  var decoded = jsonDecode(data.toString());
                  if (decoded['type'] == 'history') {
                    setState(() {
                      messages = List<Map<String, dynamic>>.from(decoded['data']);
                    });
                  } else {
                    setState(() {
                      messages.add(decoded);
                    });
                  }
                }, onDone: () {
                  _onServerDestroyed();
                }, onError: (error) {
                  _onServerDestroyed();
                });

              } catch (e) {
                _showErrorAndExit("Could not connect to host. Check IP.");
              }
            }

            void _onServerDestroyed() {
              if (_isExiting) return;
              if (!mounted) return;
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  title: const Text("Disconnected"),
                  content: const Text("Host destroyed server. Chat history cleared."),
                  actions: [
                    ElevatedButton(
                      onPressed: () {
                        Navigator.pop(context);
                        Navigator.pop(context);
                      },
                      child: const Text("OK"),
                    )
                  ],
                ),
              );
            }

            void _sendMessage({String? fileId, String? fileName}) {
              String text = _msgController.text.trim();
              if (text.isEmpty && fileId == null) return;

              var msgData = {
                "sender": widget.username,
                "text": text,
                "fileId": fileId,
                "fileName": fileName,
                "time": _currentTime()
              };

              if (widget.isHost) {
                _broadcastMessage(msgData);
                _saveAndAddMessage(msgData);
              } else {
                _clientWs?.add(jsonEncode(msgData));
              }

              _msgController.clear();
            }

            void _pickAndSendFile() async {
              FilePickerResult? result = await FilePicker.platform.pickFiles();
              if (result != null && result.files.single.path != null) {
                setState(() => _isUploading = true);
                try {
                  File file = File(result.files.single.path!);
                  String fileName = result.files.single.name;
                  String fileId = DateTime.now().millisecondsSinceEpoch.toString();

                  if (widget.isHost) {
                    final dir = await getTemporaryDirectory();
                    await file.copy('${dir.path}/$fileId');
                  } else {
                    HttpClient client = HttpClient();
                    var req = await client.postUrl(Uri.parse('http://${widget.serverIp}:8080/upload?id=$fileId'));
                    await req.addStream(file.openRead());
                    await req.close();
                  }

                  _sendMessage(fileId: fileId, fileName: fileName);
                } catch(e) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("File transfer failed: $e")));
                }
                setState(() => _isUploading = false);
              }
            }

            Future<void> _downloadFile(String fileId, String fileName) async {
              try {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Downloading file...")));
                HttpClient client = HttpClient();
                var req = await client.getUrl(Uri.parse('http://${widget.serverIp}:8080/files/$fileId/${Uri.encodeComponent(fileName)}'));
                var res = await req.close();
                
                final dir = Directory('/storage/emulated/0/Download');
                String savePath = dir.existsSync() ? dir.path : (await getApplicationDocumentsDirectory()).path;
                
                String baseName = fileName;
                String ext = "";
                if (fileName.contains('.')) {
                  baseName = fileName.substring(0, fileName.lastIndexOf('.'));
                  ext = fileName.substring(fileName.lastIndexOf('.'));
                }

                File file = File('$savePath/$fileName');
                int counter = 1;
                while (file.existsSync()) {
                  file = File('$savePath/${baseName}_($counter)$ext');
                  counter++;
                }
                
                var sink = file.openWrite();
                await sink.addStream(res);
                await sink.close();

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("Successfully Saved to Downloads!")));
                }
              } catch(e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Download failed: $e")));
              }
            }

            bool _canPreview(String fileName) {
              String ext = fileName.contains('.') ? fileName.split('.').last.toLowerCase() : '';
              return ['png', 'jpg', 'jpeg', 'gif', 'webp', 'mp4', 'mkv', 'avi', 'mov', 'mp3', 'wav', 'ogg', 'm4a', 'pdf'].contains(ext);
            }

            void _previewFile(String fileId, String fileName) {
              String url = 'http://${widget.serverIp}:8080/files/$fileId/${Uri.encodeComponent(fileName)}';
              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (context) => AppPreviewScreen(url: url, fileName: fileName),
                ),
              );
            }

            String _currentTime() {
              final now = DateTime.now();
              return "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}";
            }

            void _showQRDialog() {
              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text("Scan to Join Chat"),
                  content: SizedBox(
                    width: 230,
                    height: 230,
                    child: Center(
                      child: QrImageView(
                        data: widget.serverIp,
                        version: QrVersions.auto,
                        size: 210.0,
                        backgroundColor: Colors.white,
                      ),
                    ),
                  ),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent),
                      onPressed: () => Navigator.pop(context),
                      child: const Text("Close", style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }

            void _saveChatAsZip() async {
              try {
                final zipDir = Directory('/storage/emulated/0/Download');
                String path = zipDir.existsSync() ? zipDir.path : (await getApplicationDocumentsDirectory()).path;

                final archive = Archive();
                String jsonStr = jsonEncode(messages);
                archive.addFile(ArchiveFile('chat_history.json', jsonStr.length, utf8.encode(jsonStr)));

                var encoder = ZipEncoder();
                var encodedZip = encoder.encode(archive);

                File zipFile = File('$path/GlobalChat_Backup_${DateTime.now().millisecondsSinceEpoch}.zip');
                await zipFile.writeAsBytes(encodedZip!);

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text("Chat saved to Downloads: ${zipFile.path.split('/').last}"))
                  );
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text("Failed to save ZIP: $e"))
                  );
                }
              }
            }

            Future<void> _destroyServerAndExit() async {
              _isExiting = true;
              if (widget.isHost) {
                for (var client in connectedClients) {
                  client.close();
                }
                await _rawServer?.close(force: true);

                if (_tempHistoryFile != null && await _tempHistoryFile!.exists()) {
                  await _tempHistoryFile!.delete();
                }
              } else {
                await _clientWs?.close();
              }
              if (mounted) Navigator.pop(context);
            }

            void _showErrorAndExit(String error) {
              _isExiting = true;
              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text("Error"),
                  content: Text(error),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                        Navigator.pop(context);
                      },
                      child: const Text("OK"),
                    )
                  ],
                ),
              );
            }

            @override
            void dispose() {
              if (widget.isHost) {
                _rawServer?.close(force: true);
                if (_tempHistoryFile != null && _tempHistoryFile!.existsSync()) {
                  _tempHistoryFile!.deleteSync();
                }
              } else {
                _clientWs?.close();
              }
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (didPop) async {
                  if (didPop) return;
                  if (widget.isHost) {
                    bool confirm = await showDialog(
                      context: context,
                      builder: (context) => AlertDialog(
                        title: const Text("Destroy Server?"),
                        content: const Text("Closing will disconnect all users and PERMANENTLY DELETE server chat history."),
                        actions: [
                          TextButton(onPressed: () => Navigator.pop(context, false), child: const Text("Cancel")),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                            onPressed: () => Navigator.pop(context, true), 
                            child: const Text("Destroy", style: TextStyle(color: Colors.white))
                          ),
                        ],
                      ),
                    ) ?? false;
                    if (confirm) await _destroyServerAndExit();
                  } else {
                    await _destroyServerAndExit();
                  }
                },
                child: Scaffold(
                  appBar: AppBar(
                    title: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
