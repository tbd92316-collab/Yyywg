          class AppPreviewScreen extends StatefulWidget {
            final String url;
            final String fileName;

            const AppPreviewScreen({super.key, required this.url, required this.fileName});

            @override
            State<AppPreviewScreen> createState() => _AppPreviewScreenState();
          }

          class _AppPreviewScreenState extends State<AppPreviewScreen> {
            VideoPlayerController? _videoController;
            AudioPlayer? _audioPlayer;
            bool isPlaying = false;
            bool isLoadingMedia = true;

            @override
            void initState() {
              super.initState();
              _initMediaPreview();
            }

            void _initMediaPreview() async {
              String ext = widget.fileName.contains('.') ? widget.fileName.split('.').last.toLowerCase() : '';
              if (['mp4', 'mkv', 'avi', 'mov'].contains(ext)) {
                _videoController = VideoPlayerController.networkUrl(Uri.parse(widget.url))
                  ..initialize().then((_) {
                    setState(() {
                      isLoadingMedia = false;
                    });
                    _videoController!.play();
                  });
              } else if (['mp3', 'wav', 'ogg', 'm4a'].contains(ext)) {
                _audioPlayer = AudioPlayer();
                await _audioPlayer!.setSource(UrlSource(widget.url));
                setState(() {
                  isLoadingMedia = false;
                });
                _audioPlayer!.resume();
                setState(() {
                  isPlaying = true;
                });
                _audioPlayer!.onPlayerComplete.listen((_) {
                  setState(() {
                    isPlaying = false;
                  });
                });
              } else {
                setState(() {
                  isLoadingMedia = false;
                });
              }
            }

            @override
            void dispose() {
              _videoController?.dispose();
              _audioPlayer?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              String ext = widget.fileName.contains('.') ? widget.fileName.split('.').last.toLowerCase() : '';
              bool isImage = ['png', 'jpg', 'jpeg', 'gif', 'webp'].contains(ext);
              bool isVideo = ['mp4', 'mkv', 'avi', 'mov'].contains(ext);
              bool isAudio = ['mp3', 'wav', 'ogg', 'm4a'].contains(ext);
              bool isPdf = ext == 'pdf';

              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  iconTheme: const IconThemeData(color: Colors.white),
                  title: Text(widget.fileName, style: const TextStyle(color: Colors.white, fontSize: 16)),
                  leading: IconButton(
                    icon: const Icon(Icons.close),
                    onPressed: () => Navigator.pop(context),
                  ),
                ),
                body: Center(
                  child: isLoadingMedia
                      ? const CircularProgressIndicator(color: Colors.white)
                      : isImage
                          ? InteractiveViewer(
                              child: Image.network(
                                widget.url,
                                loadingBuilder: (context, child, loadingProgress) {
                                  if (loadingProgress == null) return child;
                                  return const CircularProgressIndicator(color: Colors.white);
                                },
                                errorBuilder: (context, error, stackTrace) => const Text(
                                  "Failed to load image", 
                                  style: TextStyle(color: Colors.white)
                                ),
                              ),
                            )
                          : isVideo
                              ? _videoController != null && _videoController!.value.isInitialized
                                  ? AspectRatio(
                                      aspectRatio: _videoController!.value.aspectRatio,
                                      child: VideoPlayer(_videoController!),
                                    )
                                  : const Text("Failed to load video", style: TextStyle(color: Colors.white))
                              : isAudio
                                  ? Column(
                                      mainAxisAlignment: MainAxisAlignment.center,
                                      children: [
                                        const Icon(Icons.audiotrack, size: 90, color: Colors.blueAccent),
                                        const SizedBox(height: 20),
                                        Text(widget.fileName, style: const TextStyle(color: Colors.white, fontSize: 16)),
                                        const SizedBox(height: 30),
                                        IconButton(
                                          iconSize: 64,
                                          color: Colors.white,
                                          icon: Icon(isPlaying ? Icons.pause_circle_filled : Icons.play_circle_filled),
                                          onPressed: () async {
                                            if (isPlaying) {
                                              await _audioPlayer!.pause();
                                              setState(() => isPlaying = false);
                                            } else {
                                              await _audioPlayer!.resume();
                                              setState(() => isPlaying = true);
                                            }
                                          },
                                        )
                                      ],
                                    )
                                  : isPdf
                                      ? Column(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            const Icon(Icons.picture_as_pdf, size: 80, color: Colors.redAccent),
                                            const SizedBox(height: 20),
                                            const Text("PDF Document Ready", style: TextStyle(color: Colors.white70, fontSize: 16)),
                                            const SizedBox(height: 20),
                                            ElevatedButton.icon(
                                              icon: const Icon(Icons.download),
                                              label: const Text("Download PDF to Read"),
                                              onPressed: () async {
                                                if (!await launchUrl(Uri.parse(widget.url), mode: LaunchMode.externalApplication)) {
                                                  if (context.mounted) {
                                                    ScaffoldMessenger.of(context).showSnackBar(
                                                      const SnackBar(content: Text("Could not open PDF"))
                                                    );
                                                  }
                                                }
                                              },
                                            )
                                          ],
                                        )
                                      : const Text("Preview not supported for this file type", style: TextStyle(color: Colors.white)),
                ),
                floatingActionButton: isVideo && _videoController != null && _videoController!.value.isInitialized
                    ? FloatingActionButton(
                        backgroundColor: Colors.white,
                        child: Icon(
                          _videoController!.value.isPlaying ? Icons.pause : Icons.play_arrow,
                          color: Colors.black,
                        ),
                        onPressed: () {
                          setState(() {
                            _videoController!.value.isPlaying ? _videoController!.pause() : _videoController!.play();
                          });
                        },
                      )
                    : null,
              );
            }
          }
