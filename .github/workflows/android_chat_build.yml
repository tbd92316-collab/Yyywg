      - name: Build Android APK
        run: |
          cd global_chat_android
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: global_chat_android/build/app/outputs/flutter-apk/app-release.apk
